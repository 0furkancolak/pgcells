name: Feature request
description: Propose a change or addition
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What are you trying to do and what stops you? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposal, description: "Keep in mind the project rules in CONTRIBUTING.md: explicit targets, no hidden retries, no new environment variables." }
