name: release
on:
  push:
    branches: [main]
concurrency: release-${{ github.ref }}
permissions: {}
jobs:
  release:
    # Only the canonical repository publishes; forks and the pre-rename repository stay green.
    if: github.repository == '0furkancolak/pgcells'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # tags and the version pull request branch
      pull-requests: write   # the "version packages" pull request
      id-token: write        # npm provenance (GitHub OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      # npm trusted publishing (OIDC, no token) needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1
      # Opens or updates the "version packages" pull request; when that is merged it runs scripts/publish.sh (changesets/action creates no
      # git tags or GitHub releases when a custom publish command is used; tag the release manually).
      # Needs either npm trusted publishing for @0furkancolak/pgcells* or an NPM_TOKEN secret with publish rights on the @0furkancolak scope.
      - uses: changesets/action@v2
        with:
          version: bun run version-packages
          publish: bash scripts/publish.sh
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
