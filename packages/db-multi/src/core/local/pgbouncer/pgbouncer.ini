[databases]
db0 = host=postgres-0 port=5432 dbname=app
db1 = host=postgres-1 port=5432 dbname=app

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
unix_socket_dir = /tmp
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 200
default_pool_size = 10
reserve_pool_size = 0
query_wait_timeout = 10
server_idle_timeout = 30
max_prepared_statements = 0
admin_users = admin
