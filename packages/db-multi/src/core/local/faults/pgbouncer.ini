; Fault-injection pooler (compose service pgbouncer-faults): its servers are reached through toxiproxy so tests can break the pooler-to-PostgreSQL leg.
[databases]
db0 = host=toxiproxy port=15440 dbname=app
db1 = host=toxiproxy port=15441 dbname=app

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /tmp
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 200
default_pool_size = 5
reserve_pool_size = 0
query_wait_timeout = 8
server_connect_timeout = 3
server_login_retry = 1
server_idle_timeout = 30
max_prepared_statements = 0
admin_users = admin
