; Generated by pgcells (tools pooler generate). Starting values: measure, then adjust. See docs/guides/connections.md.
; Sized for 2 PgBouncer instance(s); run each with this file behind an L4 load balancer.

[databases]
; One alias per node (the application's DATABASE_URLS entry points at the alias) and one per replica.
db0 = host=pg0.eu.internal port=5432 dbname=app pool_size=20
db1 = host=pg1.eu.internal port=6543 dbname=tenants pool_size=20
db1_ro1 = host=pg1-ro.eu.internal port=5432 dbname=tenants pool_size=20
db1_ro2 = host=pg1-ro2.eu.internal port=5432 dbname=tenants pool_size=20

[pgbouncer]
; pgcells requires transaction pooling.
pool_mode = transaction
listen_addr = 0.0.0.0
listen_port = 6432
; Lets several pgbouncer processes share one host.
so_reuseport = 1

max_client_conn = 2000
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 40

; Timeouts: query_wait_timeout stays above the application's answer deadline (statementTimeoutMs 5000 + 1 s + 0.5 s).
query_wait_timeout = 8
server_connect_timeout = 5
server_login_retry = 1
client_login_timeout = 10
idle_transaction_timeout = 15
server_idle_timeout = 60
server_lifetime = 1800
tcp_keepalive = 1

; Named prepared statements are not used.
max_prepared_statements = 0

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
; TLS is required on both sides; point client_tls_* and server_tls_ca_file at your certificates.
client_tls_sslmode = require
server_tls_sslmode = verify-full

admin_users = pgbouncer_admin
stats_users = pgbouncer_stats
