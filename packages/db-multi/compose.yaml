# postgres-rp/postgres-rp-replica: replica tests (streaming replication). postgres-0: platform database + tenant database db0; postgres-1: tenant database db1. CLI/tests use direct ports; PgBouncer (transaction pooling) serves runtime tests.
services:
  postgres-0:
    image: postgres:16.15-alpine
    environment: {POSTGRES_DB: app, POSTGRES_USER: admin, POSTGRES_PASSWORD: local_admin_password}
    ports: ['127.0.0.1:5540:5432']
    volumes: ['postgres0:/var/lib/postgresql/data']
    healthcheck: {test: ['CMD-SHELL', 'pg_isready -U admin -d app'], interval: 2s, timeout: 2s, retries: 30}
  postgres-1:
    image: postgres:16.15-alpine
    environment: {POSTGRES_DB: app, POSTGRES_USER: admin, POSTGRES_PASSWORD: local_admin_password}
    ports: ['127.0.0.1:5541:5432']
    volumes: ['postgres1:/var/lib/postgresql/data']
    healthcheck: {test: ['CMD-SHELL', 'pg_isready -U admin -d app'], interval: 2s, timeout: 2s, retries: 30}
  pgbouncer:
    build: ./src/core/local/pgbouncer
    ports: ['127.0.0.1:5543:5432']
    volumes:
      - './src/core/local/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro'
      - './src/core/local/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro'
    depends_on: {postgres-0: {condition: service_healthy}, postgres-1: {condition: service_healthy}}
    healthcheck: {test: ['CMD-SHELL', 'nc -z 127.0.0.1 5432'], interval: 2s, timeout: 2s, retries: 30}
  # Local testing only: the Neon driver (WebSocket) reaches the host's Postgres/PgBouncer ports through this proxy.
  wsproxy:
    image: ghcr.io/neondatabase/wsproxy@sha256:7f2e2149aa6a57ba382a140102fba44f5053f3e44389ccc18adcecf896054efb
    environment: {ALLOW_ADDR_REGEX: '.*'}
    extra_hosts: ['host.docker.internal:host-gateway']
    ports: ['127.0.0.1:5488:80']
  # Replica tests only: a primary/replica pair with streaming replication (independent of postgres-0/1).
  postgres-rp:
    image: postgres:16.15-alpine
    environment: {POSTGRES_DB: app, POSTGRES_USER: admin, POSTGRES_PASSWORD: local_admin_password}
    ports: ['127.0.0.1:5545:5432']
    volumes:
      - 'postgresrp:/var/lib/postgresql/data'
      - './src/core/local/replica/allow-replication.sh:/docker-entrypoint-initdb.d/allow-replication.sh:ro'
    healthcheck: {test: ['CMD-SHELL', 'pg_isready -U admin -d app'], interval: 2s, timeout: 2s, retries: 30}
  postgres-rp-replica:
    image: postgres:16.15-alpine
    entrypoint: ['sh', '/replica-entrypoint.sh']
    ports: ['127.0.0.1:5546:5432']
    volumes:
      - 'postgresrpreplica:/var/lib/postgresql/data'
      - './src/core/local/replica/replica-entrypoint.sh:/replica-entrypoint.sh:ro'
    depends_on: {postgres-rp: {condition: service_healthy}}
    healthcheck: {test: ['CMD-SHELL', 'pg_isready -U admin -d app'], interval: 2s, timeout: 2s, retries: 30}
  # Fault-injection tests only (toxiproxy: latency, partitions, resets). app-pooler 5581 -> pgbouncer-faults; the pooler reaches PostgreSQL through
  # pooler-pg0/pooler-pg1, so each leg can be broken separately. The toxiproxy API is on 8474.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ['-host=0.0.0.0', '-config=/toxiproxy.json']
    ports: ['127.0.0.1:8474:8474', '127.0.0.1:5581:5581']
    volumes: ['./src/core/local/faults/toxiproxy.json:/toxiproxy.json:ro']
    depends_on: {postgres-0: {condition: service_healthy}, postgres-1: {condition: service_healthy}}
  pgbouncer-faults:
    build: ./src/core/local/pgbouncer
    volumes:
      - './src/core/local/faults/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro'
      - './src/core/local/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro'
    depends_on: [toxiproxy]
    healthcheck: {test: ['CMD-SHELL', 'nc -z 127.0.0.1 6432'], interval: 2s, timeout: 2s, retries: 30}
volumes:
  postgres0:
  postgres1:
  postgresrp:
  postgresrpreplica:
